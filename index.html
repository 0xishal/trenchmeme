<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>TrenchMeme — Solana meme coin checker</title>
<style>
  :root { --bg:#0b0d0c; --panel:#121614; --line:#1f2622; --text:#d9e3dc; --dim:#7d8b82; --good:#3ddc84; --warn:#f5c542; --bad:#ff5c5c; --accent:#9cff57; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; color:var(--accent); letter-spacing:.5px; }
  .sub { color:var(--dim); margin:0 0 20px; }
  .bar { display:flex; gap:8px; }
  input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text); padding:12px 14px; border-radius:8px; font:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#0b0d0c; border:0; border-radius:8px; padding:0 16px; font:inherit; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .tabs { display:flex; gap:8px; margin:18px 0 12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-top:12px; }
  .verdict { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .vlabel { font-size:22px; font-weight:800; }
  .score { font-size:30px; font-weight:800; }
  .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .na{color:var(--dim)}
  table { width:100%; border-collapse:collapse; }
  td, th { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kv b { display:block; font-size:16px; }
  .kv span { color:var(--dim); font-size:12px; }
  a { color:var(--accent); }
  .links a { margin-right:12px; }
  .dim { color:var(--dim); }
  .row { cursor:pointer; } .row:hover { background:#18201b; }
  code { word-break:break-all; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🪖 TrenchMeme</h1>
  <p class="sub">Alat utama ada di bot Telegram. Halaman ini cadangan: paste CA Solana → analisis otomatis.</p>
  <div class="bar">
    <input id="ca" placeholder="Paste CA / link DexScreener / pump.fun …" autocomplete="off" />
    <button id="go">Cek</button>
  </div>
  <div class="tabs">
    <button class="ghost" id="feedBtn">Kandidat baru &lt;50k</button>
    <button class="ghost" id="setupBtn">Status bot</button>
  </div>
  <div id="out"></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const out = $('#out');
const fmtK = (n) => n == null ? '?' : n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : Math.round(n);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let key = ''; try { key = localStorage.getItem('tm_key') || ''; } catch {}

async function api(path) {
  const r = await fetch(path, { headers: key ? { 'x-access-key': key } : {} });
  if (r.status === 401) { key = prompt('Masukkan ACCESS_KEY') || ''; try { localStorage.setItem('tm_key', key); } catch {} return api(path); }
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
}
const isCA = (s) => /[1-9A-HJ-NP-Za-km-z]{32,44}/.test(s);

async function analyze(raw) {
  const m = String(raw).match(/[1-9A-HJ-NP-Za-km-z]{32,44}/g); if (!m) return;
  const ca = m.find((x) => x.endsWith('pump')) || m[0];
  history.replaceState(null, '', '?ca=' + ca);
  out.innerHTML = `<div class="card dim">⏳ Menganalisis <code>${esc(ca)}</code> … (10–40 detik)</div>`;
  try { render(await api('/api/analyze?ca=' + ca)); }
  catch (e) { out.innerHTML = `<div class="card bad">❌ ${esc(e.message)}</div>`; }
}

function render(r) {
  const v = r.verdict, mk = r.market, L = r.launch;
  const cls = v.level === 'buy' ? 'good' : v.level === 'caution' ? 'warn' : 'bad';
  const ico = { good:'✅', warn:'⚠️', bad:'❌', na:'▫️' };
  const links = {
    DexScreener: mk.url || `https://dexscreener.com/solana/${r.mint}`, 'Pump.fun': `https://pump.fun/coin/${r.mint}`,
    GMGN: `https://gmgn.ai/sol/token/${r.mint}`, Axiom: `https://axiom.trade/meme/${mk.pairAddress || r.mint}`,
    RugCheck: `https://rugcheck.xyz/tokens/${r.mint}`, Bubblemaps: `https://app.bubblemaps.io/sol/token/${r.mint}`,
    Solscan: `https://solscan.io/token/${r.mint}`,
  };
  out.innerHTML = `
  <div class="card verdict">
    <div><div class="vlabel ${cls}">${v.emoji} ${esc(v.label)}</div><div class="dim">${esc(v.reason)}</div>
      <div style="margin-top:6px"><b>$${esc(r.token.symbol)}</b> — ${esc(r.token.name)}<br><code class="dim">${r.mint}</code></div></div>
    <div class="score ${cls}">${r.score}<span class="dim" style="font-size:14px">/100</span></div>
  </div>
  <div class="card grid">
    ${kv('Market cap', '$'+fmtK(mk.mcap))}${kv('Likuiditas', '$'+fmtK(mk.liquidityUsd))}
    ${kv('Vol 1 jam', '$'+fmtK(mk.volume?.h1))}${kv('Buy/Sell 1j', mk.txns?.h1 ? mk.txns.h1.buys+'/'+mk.txns.h1.sells : '?')}
    ${kv('Holder', r.holders.total ?? '?')}${kv('Umur', mk.ageMin != null ? mk.ageMin+' menit' : '?')}
    ${kv(mk.onCurve ? 'Bonding curve' : 'DEX', mk.onCurve ? (mk.curveProgress?.toFixed(0) ?? '?')+'%' : esc(mk.dex || '?'))}
    ${kv('Dev holding', r.dev.heldPct != null ? r.dev.heldPct.toFixed(2)+'%' : '?')}
  </div>
  <div class="card"><table><tr><th></th><th>Indikator</th><th>Nilai</th></tr>
    ${r.indicators.map((i) => `<tr><td>${ico[i.status]}</td><td>${esc(i.label)}${i.critical && i.status==='bad' ? ' <span class="bad">(kritis)</span>' : ''}</td><td class="${i.status}">${esc(i.value)}</td></tr>`).join('')}
  </table></div>
  ${r.holders.list ? `<div class="card"><b>Top holder</b><table><tr><th>#</th><th>Wallet</th><th>%</th><th>Label</th></tr>
    ${r.holders.list.map((h, i) => `<tr><td>${i+1}</td><td><a target="_blank" href="https://solscan.io/account/${h.owner}">${h.owner.slice(0,6)}…${h.owner.slice(-4)}</a></td><td>${h.pct.toFixed(2)}</td><td class="dim">${esc(h.label)}</td></tr>`).join('')}
  </table></div>` : ''}
  ${r.smartMoney?.hits?.length ? `<div class="card"><b>👑 KOL & Smart Money</b> <span class="dim">(${r.smartMoney.holding} pegang · ${r.smartMoney.sold} jual · dicek ${r.smartMoney.checked} wallet)</span><table><tr><th>Nama</th><th>Tipe</th><th>Status</th><th></th></tr>
    ${r.smartMoney.hits.map((h) => `<tr><td>${h.twitter ? `<a target="_blank" href="${esc(h.twitter)}">${esc(h.name || h.address.slice(0,6))}</a>` : esc(h.name || h.address.slice(0,6)+'…')}</td><td class="dim">${esc(h.type)}</td><td class="${h.status==='holding'?'good':'warn'}">${h.status==='holding' ? 'pegang '+h.pct.toFixed(2)+'%' : 'sudah jual'}</td><td><a target="_blank" href="https://gmgn.ai/sol/address/${h.address}">GMGN</a></td></tr>`).join('')}
  </table></div>` : ''}
  ${L && !L.incomplete && L.bundleList?.length ? `<div class="card"><b>Wallet bundle (blok 0)</b><table>
    ${L.bundleList.map((b) => `<tr><td><a target="_blank" href="https://solscan.io/account/${b.wallet}">${b.wallet.slice(0,6)}…${b.wallet.slice(-4)}</a></td><td>beli ${b.pct.toFixed(2)}%</td></tr>`).join('')}
  </table></div>` : ''}
  <div class="card links">${Object.entries(links).map(([k, u]) => `<a target="_blank" href="${u}">${k}</a>`).join('')}</div>
  <p class="dim">Analisis ${(r.tookMs/1000).toFixed(1)} dtk · ${new Date(r.analyzedAt).toLocaleString('id-ID')} · Bukan nasihat keuangan.</p>`;
}
const kv = (k, v) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`;

async function feed() {
  out.innerHTML = '<div class="card dim">⏳ Memuat kandidat …</div>';
  try {
    const f = await api('/api/feed');
    out.innerHTML = `<div class="card"><div class="dim">Dipindai ${f.scanned} token · lolos prefilter ${f.passed.length}. Klik baris untuk analisis penuh.</div>
      <table><tr><th>Token</th><th>MC</th><th>Vol 1j</th><th>B/S</th><th>Umur</th></tr>
      ${f.passed.map((t) => `<tr class="row" data-ca="${t.mint}"><td><b>${esc(t.symbol)}</b> <span class="dim">${esc(t.dex)}</span></td><td>$${fmtK(t.mcap)}</td><td>$${fmtK(t.vol1h)}</td><td>${t.buys1h}/${t.sells1h}</td><td>${t.ageMin}m</td></tr>`).join('') || '<tr><td colspan="5" class="dim">Belum ada kandidat.</td></tr>'}
      </table></div>`;
    out.querySelectorAll('.row').forEach((tr) => tr.onclick = () => { $('#ca').value = tr.dataset.ca; analyze(tr.dataset.ca); });
  } catch (e) { out.innerHTML = `<div class="card bad">❌ ${esc(e.message)}</div>`; }
}

$('#go').onclick = () => analyze($('#ca').value);
$('#ca').addEventListener('paste', (e) => setTimeout(() => isCA($('#ca').value) && analyze($('#ca').value), 0));
$('#ca').addEventListener('keydown', (e) => e.key === 'Enter' && analyze($('#ca').value));
$('#feedBtn').onclick = feed;
$('#setupBtn').onclick = async () => { out.innerHTML = '<div class="card dim">⏳</div>'; try { const r = await fetch('/api/setup').then((r) => r.json()); out.innerHTML = `<div class="card"><pre style="white-space:pre-wrap">${esc(JSON.stringify(r, null, 2))}</pre></div>`; } catch (e) { out.innerHTML = `<div class="card bad">${esc(e.message)}</div>`; } };
const q = new URLSearchParams(location.search).get('ca'); if (q) { $('#ca').value = q; analyze(q); }
</script>
</body>
</html>
